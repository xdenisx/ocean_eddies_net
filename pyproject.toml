[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-eddy-segmentation"
version = "0.1.0rc1"
description = "GeoTIFF binary and multiclass semantic segmentation of ocean imagery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "rasterio>=1.3,<2", "torch>=2.3,<3",
  "scipy>=1.11,<2", "scikit-image>=0.22,<0.27",
  "opencv-python-headless>=4.8,<5", "PyYAML>=6,<7", "tqdm>=4.66,<5"
]

[project.optional-dependencies]
smp = ["segmentation-models-pytorch>=0.5,<0.6", "timm>=1.0,<1.1"]
hf = ["transformers>=4.50,<5", "torchvision>=0.18,<1", "safetensors>=0.4"]
timm = ["timm>=1.0,<1.1"]
all = ["segmentation-models-pytorch>=0.5,<0.6", "timm>=1.0,<1.1", "transformers>=4.50,<5", "torchvision>=0.18,<1", "safetensors>=0.4"]
legacy = ["albumentations>=2.0.8,<2.1", "scikit-learn>=1.4,<2"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
eddy-train = "ocean_eddy.cli:train_main"
eddy-infer = "ocean_eddy.cli:infer_main"
eddy-validate = "ocean_eddy.cli:validate_main"
eddy-preprocess = "ocean_eddy.cli:preprocess_main"
eddy-doctor = "ocean_eddy.cli:doctor_main"
eddy-convert-legacy = "ocean_eddy.cli:convert_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
